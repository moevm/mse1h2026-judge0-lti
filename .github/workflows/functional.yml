name: Functional Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional-tests:
    name: Run Functional Tests (PostgreSQL + Judge0)
    runs-on: ubuntu-latest

    services:
      postgresdb:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start Judge0 containers
        run: |
          docker run -d --name judge0-server \
            -p 2358:2358 \
            -e REDIS_URL=redis://localhost:6379 \
            mrkushalsm/judge0:cgv2
          
          docker run -d --name judge0-worker \
            --entrypoint ./scripts/workers \
            -e REDIS_URL=redis://localhost:6379 \
            mrkushalsm/judge0:cgv2
          
          sleep 15
          curl -f http://localhost:2358/about || echo "Judge0 not ready"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for services
        run: |
          sleep 5
          psql -h localhost -U test_user -d test_db -c "SELECT 1" || true

      - name: Run functional tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test_secret_key_12345
          MOCK_JUDGE0: false
          JUDGE0_URL: http://localhost:2358
        run: |
          pytest tests/functional/ -v -m functional --tb=short

      - name: Stop Judge0 containers
        if: always()
        run: |
          docker stop judge0-server judge0-worker || true
          docker rm judge0-server judge0-worker || true