name: Functional Tests

on:
  push:
    branches: [main, feature/issue-99-create-tests]
  workflow_dispatch:

jobs:
  functional-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare Judge0 config
        run: cp judge0.conf.example judge0.conf

      - name: Run tests via docker-compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Show logs on failure (backend + tests only)
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs backend
          docker compose -f docker-compose.test.yml logs tests

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v