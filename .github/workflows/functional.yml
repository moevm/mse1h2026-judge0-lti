name: Functional Tests

on:
  push:
    branches: [main, feature/issue-99-create-tests]
  workflow_dispatch:

jobs:
  functional-tests:
    name: Run Functional Tests (PostgreSQL + Judge0)
    runs-on: ubuntu-latest

    services:
      postgresdb:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start Redis and Judge0 with Docker network
        run: |
          docker network create judge0-net || true
          
          docker run -d --name judge0-redis \
            --network judge0-net \
            redis:7.2-alpine
          
          docker run -d --name judge0-server \
            --network judge0-net \
            -p 2358:2358 \
            -e REDIS_URL=redis://judge0-redis:6379 \
            judge0/judge0:latest
          
          docker run -d --name judge0-worker \
            --network judge0-net \
            -e REDIS_URL=redis://judge0-redis:6379 \
            judge0/judge0:latest \
            ./scripts/workers
          
          echo "Waiting for Judge0 to be ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:2358/about > /dev/null 2>&1; then
              echo "Judge0 is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done
          
          docker ps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run functional tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test_secret_key_12345
          MOCK_JUDGE0: false
          JUDGE0_URL: http://localhost:2358
        run: |
          pytest tests/functional/test_check.py -v -m functional --tb=short

      - name: Stop containers
        if: always()
        run: |
          docker stop judge0-server judge0-worker judge0-redis || true
          docker rm judge0-server judge0-worker judge0-redis || true
          docker network rm judge0-net || true