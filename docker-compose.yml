version: '3.8'

x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-100M}
      max-file: ${LOG_MAX_FILE:-3}
      compress: "${LOG_COMPRESS:-true}"

x-resource-limits:
  &default-limits
  resources:
    limits:
      cpus: '1.0'
      memory: 1G
    reservations:
      cpus: '0.5'
      memory: 512M

services:
  postgresdb:
    image: postgres:17-alpine
    container_name: mse1h2026-judge0-lti_postgresql-judge0
    env_file: ./judge0.conf
    volumes:
      - postgres-data-judge0:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7.2.4
    container_name: mse1h2026-judge0-lti_redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: ./judge0.conf
    <<: *default-logging
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  judge0_server:
    image: mrkushalsm/judge0:cgv2

    env_file: ./judge0.conf
    container_name: mse1h2026-judge0-lti_judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358" # В проде надо будет закрыть порт 
    privileged: true   # нехорошо            <---------
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/about"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  
  judge0_worker:
    image: mrkushalsm/judge0:cgv2
    container_name: mse1h2026-judge0-lti_judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true   # нехорошо            <---------
    <<: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgresdb:
        condition: service_healthy
      judge0_server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bin/rails"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 2  # Для 10-20 студентов. Для большего количества увеличить
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.4'
          memory: 384M

  postgresdb_data:
    image: postgres:17-alpine
    container_name: mse1h2026-judge0-lti_postgresdb-data
    restart: unless-stopped
    <<: *default-logging
    env_file: 
      - .env
    volumes:
      - postgresdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    image: mse1h2026-judge0-lti_backend-python-fastapi:v.0.4
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: backend-python-fastapi # mse1h2026-judge0-lti_backend-python-fastapi для этого надо поменять nginx.conf
    restart: unless-stopped
    <<: *default-logging
    env_file:
      - .env
    depends_on:
      postgresdb_data:
        condition: service_healthy
      judge0_worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    image: mse1h2026-judge0-lti_frontend-nginx-react:v.0.4
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mse1h2026-judge0-lti_frontend-nginx-react
    restart: unless-stopped
    <<: *default-logging
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M


volumes:
  postgresdb-data:
    driver: local
  postgres-data-judge0:
    driver: local

networks:
  app-net:
    driver: bridge
